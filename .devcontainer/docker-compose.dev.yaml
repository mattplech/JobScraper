services:
  cpp-devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - devcontainer.env
    volumes:
      - ../..:/workspaces:cached
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: jobscraper
      POSTGRES_USER: jobscraper
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscraper -d jobscraper"]
      interval: 10s
      timeout: 3s
      retries: 10

secrets:
  db_password:
    file: ../.secrets/db_password