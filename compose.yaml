services:
  jobscraper:
    image: jobscraper:latest
    environment:
      JOBSCRAPER_HOST: postgres
      JOBSCRAPER_PORT: 5432
      JOBSCRAPER_NAME: jobscraper
      JOBSCRAPER_USER: jobscraper
      JOBSCRAPER_PASSWORD_FILE: /run/secrets/db_password
      JOBSCRAPER_INTERVAL_SECONDS: 43200 # Run scraping every 12 hours
    secrets:
        - db_password
    volumes:
      - ./run/config.json:/opt/jobscraper/config.json:ro
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
      image: postgres:16
      environment:
        POSTGRES_DB: jobscraper
        POSTGRES_USER: jobscraper
        POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      secrets:
        - db_password
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U jobscraper -d jobscraper"]
        interval: 10s
        timeout: 3s
        retries: 5

volumes:
  postgres_data:

secrets:
  db_password:
    file: ./.secrets/db_password