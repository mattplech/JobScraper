services:
  jobscraper:
    image: jobscraper
    build:
      context: .
      dockerfile: ./Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
      image: postgres:16
      environment:
        POSTGRES_DB: jobscraper
        POSTGRES_USER: jobscraper
        POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      secrets:
        - db_password
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U jobscraper -d jobscraper"]
        interval: 10s
        timeout: 3s
        retries: 10

volumes:
  postgres_data:

secrets:
  db_password:
    file: ./.secrets/db_password